server.port=${PORT:8081}
spring.application.name=loyalty-rewards-backend

spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loyalty_db}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:1234}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:9a2f8c4e6b1d3a7f9e8d2c4b6a8f1e3d5c7b9a1f3e5d7c9b2a4f6e8d1c3b5a7f}
jwt.expiration=${JWT_EXPIRATION:86400000}

frontend.url=${FRONTEND_URL:http://localhost:3000}

